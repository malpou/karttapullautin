on:
  pull_request:
    branches: [ "master" ]
  # the fork opens no pull requests: every stack branch is checked on push
  push:
    branches: [ "pr/**" ]
  workflow_dispatch:

name: "Regression"

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

env:
  # always emit backtraces on crashes (to help debugging)
  RUST_BACKTRACE: 1
  # cargo should always emit color
  CARGO_TERM_COLOR: always
  # pullauta logs go to runs/*/logs/, uploaded with the report
  RUST_LOG: info

jobs:
  regression:
    name: Output against the baseline ref
    runs-on: ubuntu-latest

    steps:
    - name: Checkout branch
      uses: actions/checkout@v6

    - name: Read the baseline ref
      id: baseline
      run: |
        ref=$(sed -n 's/^ref *= *"\([0-9a-f]\{40\}\)".*$/\1/p' regression/baseline.toml)
        if [ -z "$ref" ]; then
          echo "::error file=regression/baseline.toml::ref must be a full 40-character commit sha"
          exit 1
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        printf "Baseline: \`%s\` (%s)\n\n" "$ref" \
          "$(sed -n 's/^note *= *"\(.*\)"$/\1/p' regression/baseline.toml)" >> "$GITHUB_STEP_SUMMARY"

    - name: Checkout baseline
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.baseline.outputs.ref }}
        path: baseline

    - uses: dtolnay/rust-toolchain@1.97
    - uses: Swatinem/rust-cache@v2

    - name: Cache the baseline build
      id: baseline-build
      uses: actions/cache@v5
      with:
        path: baseline-bin/pullauta
        key: regression-baseline-${{ runner.os }}-${{ steps.baseline.outputs.ref }}

    - name: Build baseline
      if: steps.baseline-build.outputs.cache-hit != 'true'
      run: |
        # shares target/ (and the cached dependencies) with the branch build below
        cargo build --release --manifest-path baseline/Cargo.toml --target-dir target
        mkdir -p baseline-bin
        cp target/release/pullauta baseline-bin/pullauta

    - name: Build branch
      run: cargo build --release

    - name: Download inputs
      run: |
        mkdir regression-data
        curl -Lf --retry 3 "https://cdn.routechoic.es/test.laz" -o regression-data/test_file.laz
        curl -Lf --retry 3 "https://cdn.routechoic.es/test-osm.shp.zip" -o regression-data/test_file.shp.zip

    # each build runs with its own pullauta.default.ini and osm.txt (run.sh's
    # second argument); both use this branch's run.sh
    - name: Run baseline twice
      env:
        REGRESSION_DATA: ${{ github.workspace }}/regression-data
      run: |
        regression/run.sh baseline-bin/pullauta baseline runs/base
        regression/run.sh baseline-bin/pullauta baseline runs/base-again

    - name: Run branch
      env:
        REGRESSION_DATA: ${{ github.workspace }}/regression-data
      run: regression/run.sh target/release/pullauta . runs/head

    # this branch's eval compares all runs: the baseline's may predate a feature
    - name: Check the baseline is deterministic
      run: |
        if ! target/release/pullauta eval runs/base/output runs/base-again/output --fail-on-change > determinism.txt; then
          echo "::error::Two runs of the baseline build differ, so the comparison cannot be trusted: see determinism.txt"
          printf "### Two baseline runs differ\n\n\`\`\`\n%s\n\`\`\`\n" "$(head -n 100 determinism.txt)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Compare branch with baseline
      run: |
        target/release/pullauta eval runs/base/output runs/head/output --diff-dir diffs > report.txt
        printf "### eval baseline branch\n\n\`\`\`\n%s\n\`\`\`\n" "$(head -n 200 report.txt)" >> "$GITHUB_STEP_SUMMARY"
        if [ -f regression/expected.json ]; then
          gate=(--expected regression/expected.json)
        else
          gate=(--fail-on-change)
        fi
        status=0
        target/release/pullauta eval runs/base/output runs/head/output --format json "${gate[@]}" > report.json || status=$?
        if [ "$status" -ne 0 ]; then
          echo "::error::Output changed (eval ${gate[*]} exited $status): see report.txt, report.json and diffs/ in the artifact, and regression/CHANGES.md"
          exit 1
        fi

    - name: Upload results
      id: upload
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: regression-results
        path: |
          report.txt
          report.json
          determinism.txt
          diffs/
          runs/*/logs/
          runs/*/output/single/pullautus*.png
          runs/*/output/batch/out/merged*.png
        if-no-files-found: ignore
        overwrite: true # we need subsequent runs to overwrite the result

    - name: Output Artifact URL
      if: always()
      run: echo 'Artifacts can be downloaded [here](${{ steps.upload.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
